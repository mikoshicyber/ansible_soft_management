---
- name: "Build new product state {{ software_index_label }}: {{ software_package_label }}"
  software_manager:
    operation: transition
    state: "{{ software_database }}"
    item: "{{ software_item }}"
    phase: "{{ software_phase }}"
    files: "{{ software_effective_files }}"
    reboot: "{{ software_item_reboot }}"
    verified: "{{ software_verified if software_phase == 'done' else {'installer_changed': software_pkg_install.changed | default(false)} if software_phase == 'post' else {} }}"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: software_next_state
  when: software_phase != 'done'
  no_log: true
  tags: [always]

- name: "Save state atomically {{ software_index_label }}: {{ software_package_label }}"
  vars:
    ansible_no_target_syslog: true
    software_candidate_database: "{{ software_verified.database if software_phase == 'done' else software_next_state.database }}"
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/scripts/filesystem.ps1', rstrip=false) }}"
    parameters:
      Operation: write
      StatePath: "{{ state_db }}"
      Content: "{{ software_candidate_database | to_nice_json(indent=2, sort_keys=true, ensure_ascii=false) | b64encode }}"
      ExpectedContent: "{{ software_state_current.content_b64 }}"
      ExpectedExists: "{{ software_state_current.exists }}"
    error_action: stop
  no_log: true
  when: software_candidate_database != software_database or not software_state_current.exists
  tags: [always]

- name: "Synchronize in-memory state {{ software_index_label }}: {{ software_package_label }}"
  vars:
    software_candidate_database: "{{ software_verified.database if software_phase == 'done' else software_next_state.database }}"
  ansible.builtin.set_fact:
    software_state_current:
      exists: true
      content_b64: "{{ (software_candidate_database | to_nice_json(indent=2, sort_keys=true, ensure_ascii=false) | b64encode) if (software_candidate_database != software_database or not software_state_current.exists) else software_state_current.content_b64 }}"
    software_database: "{{ software_candidate_database }}"
  no_log: true
  tags: [always]

- name: "DEBUG state {{ software_index_label }}: {{ software_package_label }}"
  ansible.builtin.debug:
    msg: "{{ software_database.products | length }}"
  when: "'debug' in ansible_run_tags or 'never' in ansible_run_tags"
  tags: [never, debug]
