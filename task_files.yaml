---
- name: "Recheck paths before writing {{ software_index_label }}: {{ software_package_label }}"
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/scripts/filesystem.ps1', rstrip=false) }}"
    parameters:
      Operation: guard
      Paths: "{{ software_effective_files | map(attribute='path') | list }}"
    error_action: stop
  tags: [always]

- name: "Prepare file batch {{ software_index_label }}: {{ software_package_label }}"
  software_manager:
    operation: stage_files
    files: "{{ software_effective_files | rejectattr('content_b64', 'defined') | list }}"
    dest: "{{ software_item.pattern.root }}"
    cache_dir: "{{ hostvars['localhost'].software_catalog.cache_dir }}"
    snapshot: "{{ {} if ((software_run_pre | bool and software_item.pattern.pre | length > 0) or software_item.pattern.force) else software_file_hashes }}"
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  register: software_file_batch
  when: software_effective_files | rejectattr('content_b64', 'defined') | list | length > 0
  no_log: false
  tags: [always]

- name: "Copy file batch {{ software_index_label }}: {{ software_package_label }}"
  ansible.windows.win_copy:
    src: "{{ software_file_batch.directory }}/"
    dest: "{{ software_file_batch.root }}\\"
    force: true
  when: software_file_batch.count | default(0) | int > 0
  diff: false
  no_log: false
  tags: [always]

- name: "Write rendered templates {{ software_index_label }}: {{ software_package_label }}"
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/scripts/filesystem.ps1', rstrip=false) }}"
    parameters:
      Operation: template
      Paths: ["{{ software_file.path }}"]
      Content: "{{ software_file.content_b64 }}"
    error_action: stop
  loop: "{{ software_effective_files | selectattr('content_b64', 'defined') | list }}"
  loop_control:
    loop_var: software_file
    label: "{{ software_file.path }}"
  no_log: false
  diff: false
  tags: [always]

- name: "Remove managed files only {{ software_index_label }}: {{ software_package_label }}"
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/scripts/filesystem.ps1', rstrip=false) }}"
    parameters:
      Operation: remove
      Paths: "{{ software_item.remove | map(attribute='path') | list }}"
      ExpectedHashes: "{{ dict((software_item.remove | selectattr('checksum','defined') | map(attribute='path') | list) | zip(software_item.remove | selectattr('checksum','defined') | map(attribute='checksum') | list)) }}"
    error_action: stop
  when: software_item.remove | length > 0
  tags: [always]
