---
- name: Проверить отправку отчёта в Telegram
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    software_catalog:
      catalog: []
    software_metadata_only: false

  tasks:
    - name: Сформировать и отправить тестовый отчёт
      ansible.builtin.include_tasks: telegram.yaml
      tags: [always]

    - name: Проверить успешность отправки
      ansible.builtin.assert:
        that:
          - software_telegram_result is defined
          - software_telegram_result is not skipped
          - software_telegram_result is succeeded
        fail_msg: "Telegram: отправка не выполнена или завершилась ошибкой."
        success_msg: "Telegram: тестовый отчёт успешно отправлен."
      tags: [always]