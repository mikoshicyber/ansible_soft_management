---
- name: Test Telegram report delivery
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    software_catalog:
      catalog: []
    software_metadata_only: false
  tasks:
    - name: Generate and send test report
      ansible.builtin.include_tasks: telegram.yaml
      tags: [always]

    - name: Verify successful delivery
      ansible.builtin.assert:
        that:
          - software_telegram_result is defined
          - software_telegram_result is not skipped
          - software_telegram_result is succeeded
        fail_msg: "Telegram: delivery was skipped or failed."
        success_msg: "Telegram: test report sent successfully."
      tags: [always]
